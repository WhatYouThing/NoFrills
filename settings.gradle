pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

sourceControl {
	gitRepository("https://github.com/WhatYouThing/owo-lib.git") {
		producesModule("io.wispforest:owo-lib")
	}
}

include 'annotationprocessor'